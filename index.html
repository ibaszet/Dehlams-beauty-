let L='fr',sel=new Set();
const fmt=n=>n.toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ');
const row=s=>`<div class="tr"><span>${s[L]}</span><i></i><b>${s.pre?T[L].from+' ':''}${fmt(s.p)} ${T[L].da}</b></div>`;
function card(s){const t=T[L];return `<article class="sv"><svg viewBox="0 0 24 24"><path d="${s.i}"/></svg><h3>${s[L]}</h3><small>${t.from}</small><span class="pr">${fmt(s.p)} ${t.da}</span><div class="tags">${s.t.map(x=>`<span class="tag">${x}</span>`).join('')}</div><button class="btn" data-pick="${SV.indexOf(s)}">${t.book}</button></article>`}
function render(){
 const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L=='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);
 $('#lb').textContent=L=='fr'?'العربية':'Francais';$('#ts').placeholder=t.sr;
 $('#g1').innerHTML=SV.slice(0,6).map(card).join('');$('#g2').innerHTML=SV.slice(6).map(card).join('');
 $('#tc').innerHTML=C.map((c,k)=>`<div class="cat"><h3>${c[L]}</h3>${SV.filter(s=>s.c==k).map(row).join('')}</div>`).join('');filt();
 $('#pl').innerHTML=C.map((c,k)=>`<b>${c[L]}</b>`+SV.map((s,j)=>s.c==k?`<label><input type="checkbox" data-s="${j}" ${sel.has(j)?'checked':''}>${s[L]} - ${fmt(s.p)} ${t.da}</label>`:'').join('')).join('');
 chips();
 $('#rg').innerHTML=RU.map(r=>`<div class="rc rv in"><div class="ic"><svg viewBox="0 0 24 24"><path d="${r[0]}"/></svg></div><div><h3>${t[r[1]][0]}</h3><p>${t[r[1]][1]}</p></div></div>`).join('');
 $('#gt').textContent=$('#ga').classList.contains('all')?t.gl:t.gm;
}
function chips(){const t=T[L];$('#pb').textContent=sel.size?sel.size+' '+t.nsel:t.pick;
 $('#ch').innerHTML=[...sel].map(j=>`<span class="service-chip">${SV[j][L]}<button type="button" data-rm="${j}" aria-label="remove">&times;</button></span>`).join('')}
function filt(){const q=$('#ts').value.trim().toLowerCase();let any=0;
 document.querySelectorAll('.cat').forEach(c=>{let n=0;c.querySelectorAll('.tr').forEach(r=>{const m=!q||r.textContent.toLowerCase().includes(q);r.style.display=m?'':'none';n+=m});c.style.display=n?'':'none';any+=n});
 $('#te').style.display=any?'none':'block'}
$('#ts').oninput=filt;
$('#lb').onclick=()=>{L=L=='fr'?'ar':'fr';render()};
$('#gt').onclick=()=>{$('#ga').classList.toggle('all');render()};
$('#pb').onclick=e=>{e.stopPropagation();const o=$('#pl').classList.toggle('open');$('#pb').setAttribute('aria-expanded',o)};
$('#pl').onclick=e=>e.stopPropagation();
document.addEventListener('click',e=>{$('#pl').classList.remove('open');
 const k=e.target.closest('[data-pick]');if(k){sel.add(+k.dataset.pick);render();$('#booking').scrollIntoView({behavior:'smooth'})}
 const r=e.target.closest('[data-rm]');if(r){sel.delete(+r.dataset.rm);render()}});
$('#pl').addEventListener('change',e=>{const j=+e.target.dataset.s;e.target.checked?sel.add(j):sel.delete(j);chips()});
const dr=$('#dr');$('#bg').onclick=()=>dr.classList.add('open');$('#dx').onclick=()=>dr.classList.remove('open');dr.querySelectorAll('a').forEach(a=>a.onclick=()=>dr.classList.remove('open'));
addEventListener('scroll',()=>$('#nv').classList.toggle('sc',scrollY>40),{passive:true});
$('#yr').textContent=new Date().getFullYear();
const tm=$('#tm');tm.innerHTML='<option value="">--:--</option>';
for(let h=9;h<16;h++)['00','30'].forEach(m=>tm.insertAdjacentHTML('beforeend',`<option>${String(h).padStart(2,'0')}:${m}</option>`));
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);$('#dt').min=today;
render();

function bad(id,m){const f=$(id).closest('.f');f.classList.add('err');f.querySelector('.em').textContent=T[L][m];return 1}
$('#bf').addEventListener('submit',async e=>{
 e.preventDefault();
 document.querySelectorAll('.f').forEach(f=>{f.classList.remove('err');f.querySelector('.em').textContent=''});$('#fe').textContent='';
 const name=$('#nm').value.trim(),phone=$('#ph').value.replace(/[\s.\-()]/g,''),date=$('#dt').value,time=$('#tm').value;
 let er=0;
 if(name.length<3)er+=bad('#nm','e1');
 if(!/^(0|\+213|00213)[567]\d{8}$/.test(phone))er+=bad('#ph','e2');
 if(!sel.size)er+=bad('#pb','e3');
 if(!date||date<today)er+=bad('#dt','e4');else if(new Date(date+'T12:00').getDay()===5)er+=bad('#dt','e5');
 if(!time)er+=bad('#tm','e6');
 if(er)return;
 const w=window.open('','_blank'); // pre-ouverture (Safari/iOS)
 const b=$('#sb');b.disabled=true;b.classList.add('load');
 const service=[...sel].map(j=>SV[j].fr).join(' • '),id='bk_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const rec={id,name,phone,service,date,time,appointment:date+' '+time,status:'new',source:'website'};
 try{
  const slot=db.ref(`${P}/takenSlots/${date}_${time}`);
  const tr=await slot.transaction(c=>c?undefined:true); // verrou atomique anti double-reservation
  if(!tr.committed){if(w)w.close();$('#fe').textContent=T[L].e7;throw 0}
  try{await db.ref(`${P}/bookings/${id}`).set({...rec,createdAt:firebase.database.ServerValue.TIMESTAMP})}
  catch(x){await slot.remove();throw x}
  const url=`https://wa.me/${WA}?text=`+encodeURIComponent(T[L].msg(rec));
  $('#wa').href=url;$('#bf').style.display='none';$('#ok').style.display='block';
  if(w)w.location=url;
 }catch(x){if(x!==0){console.error(x);if(w)w.close();$('#fe').textContent=T[L].e8}}
 b.disabled=false;b.classList.remove('load');
});
/* reveal + count-up */
const io=new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;const el=x.target;io.unobserve(el);el.classList.add('in');
 if(el.dataset.n){const n=+el.dataset.n,s=el.dataset.x||'',r=matchMedia('(prefers-reduced-motion:reduce)').matches;let k=0;
  const st=()=>{k+=Math.max(1,n/40);if(k>=n||r){el.textContent=n+s}else{el.textContent=Math.round(k)+s;requestAnimationFrame(st)}};st()}}),{threshold:.15});
document.querySelectorAll('.rv,[data-n]').forEach(el=>io.observe(el));
</script>
